<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>冰箱剩菜盲盒 · AI 深夜食堂</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <div class="page">
    <header class="hero">
      <h1 class="title neon-flicker">冰箱剩菜盲盒</h1>
      <p class="subtitle">深夜食堂主厨 · 在线整活</p>
    </header>

    <section class="input-card">
      <textarea id="ingredients" maxlength="200" rows="3" placeholder="例如：半个洋葱、两包泡面、一瓶可乐"></textarea>
      <div class="input-footer">
        <button id="micBtn" class="mic-btn hidden" type="button">🎙️ 语音输入</button>
        <span id="micWave" class="mic-wave hidden" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span id="micHint" class="mic-hint hidden">正在聆听，说出你的剩菜…</span>
        <span id="charCount" class="char-count">0/200</span>
      </div>
    </section>

    <button id="genBtn" class="generate-btn" type="button">召唤主厨 👨‍🍳</button>

    <div id="potLoading" class="pot-loading hidden">
      <div class="pot-scene">
        <div class="pot">🍲</div>
        <span class="ing i1">🥔</span>
        <span class="ing i2">🌽</span>
        <span class="ing i3">🥕</span>
        <span class="ing i4">🍜</span>
        <span class="bubble b1"></span>
        <span class="bubble b2"></span>
        <span class="bubble b3"></span>
        <span class="steam s1"></span>
        <span class="steam s2"></span>
      </div>
      <p id="potText" class="pot-text">AI 主厨正在脑暴你的剩菜…</p>
    </div>

    <div id="result" class="result hidden">
      <h2 id="dishName" class="dish-name neon-pink"></h2>
      <p id="dishIngredients" class="dish-ingredients"></p>

      <button id="stepsToggle" class="section-toggle" type="button"><span>👨‍🍳 轻触查看做法</span><span class="chev">▾</span></button>
      <div id="stepsWrap" class="collapsible hidden">
        <ol id="steps" class="steps"></ol>
        <p id="flipHint" class="flip-hint">👆 轻触步骤卡片翻面查看</p>
      </div>

      <h3 class="section-title">🍽️ 摆盘建议</h3>
      <p id="plating" class="plating"></p>

      <button id="warningToggle" class="section-toggle" type="button"><span>⚠️ 轻触查看主厨警告</span><span class="chev">▾</span></button>
      <p id="warning" class="warning hidden"></p>

      <div class="rate-row">
        <span class="rate-title">这菜你觉得？</span>
        <button class="rate-btn good" data-rating="真香" type="button">真香 😋</button>
        <button class="rate-btn bad" data-rating="已进医院" type="button">已进医院 🚑</button>
      </div>

      <button id="posterBtn" class="poster-btn" type="button">生成朋友圈打卡海报 📸</button>
      <button id="shareBtn" class="share-btn" type="button">分享给好友</button>
    </div>

    <section id="posterSection" class="poster-section hidden">
      <canvas id="posterCanvas" width="750" height="1200"></canvas>
      <div class="poster-actions">
        <button id="saveBtn" class="action-btn save" type="button">下载海报</button>
        <button id="sharePosterBtn" class="action-btn share" type="button">分享</button>
      </div>
      <p class="tip">把海报发给朋友，让 TA 猜猜你做了什么黑暗料理</p>
    </section>

    <section class="rank-section">
      <h2 class="rank-title">🔥 黑暗料理红黑榜</h2>
      <p class="rank-sub">看看前辈们用冰箱剩菜换来了什么结局</p>
      <div id="rankList" class="rank-scroll"></div>
    </section>

    <footer class="footer">
    Powered by 腾讯云开发 CloudBase · AI 深夜食堂
    <br>
    <a class="source-link" href="https://github.com/sun-zihang/fridge-leftover-blindbox" target="_blank" rel="noopener">🔗 源码 GitHub</a>
  </footer>
  </div>

  <div id="rankModal" class="rank-modal hidden">
    <div class="rank-modal-backdrop"></div>
    <div class="rank-modal-card">
      <button id="rankModalClose" class="rank-modal-close" type="button" aria-label="关闭">×</button>
      <div id="rankModalEmoji" class="rank-modal-emoji"></div>
      <div id="rankModalDish" class="rank-modal-dish"></div>
      <div id="rankModalTag" class="rank-modal-tag tag-good"></div>
      <p id="rankModalComment" class="rank-modal-comment"></p>
      <p class="rank-modal-foot">🔥 来自冰箱剩菜盲盒 · 深夜食堂战报</p>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.17.3/cloudbase.full.js"></script>
  <script src="./app.js"></script>
</body>
</html>
